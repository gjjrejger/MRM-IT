<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | MRM System</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <h2>MRM</h2>
        <p>Inventory & Order System</p>
      </div>
      <nav>
        <a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="inventory.html"><i class="fas fa-boxes"></i> Inventory</a>
        <a href="customer-portal.html"><i class="fas fa-users"></i> Customer Portal</a>
        <a href="verification.html"><i class="fas fa-shield-alt"></i> Product Verification</a>
        <a href="admin.html"><i class="fas fa-user-shield"></i> Admin Panel</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-navbar">
        <h2>Dashboard</h2>
        <div class="user-info">
          <span>Welcome, Admin</span>
          <i class="fas fa-bell"></i>
          <img src="images/logo.png" alt="Profile" class="profile-pic" style="width: 40px; border-radius: 50%;">
        </div>
      </header>

      <div class="content">
        <h1>Welcome to MRM System</h1>
        <p class="current-date"></p>

        <!-- Hero Image -->
        <div class="hero-image-container" style="margin: 25px 0 35px 0;">
          <img src="images/interior.png" 
               alt="MRM Factory Interior" 
               style="width: 100%; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.15);">
        </div>

        <!-- KPI Cards -->
        <div class="kpi-grid">
          <div class="kpi-card">
            <i class="fas fa-boxes"></i>
            <h3>Total Stock Items</h3>
            <h2>248</h2>
          </div>
          <div class="kpi-card">
            <i class="fas fa-shopping-cart"></i>
            <h3>Pending Orders</h3>
            <h2>12</h2>
          </div>
          <div class="kpi-card">
            <i class="fas fa-users"></i>
            <h3>Active Customers</h3>
            <h2>89</h2>
          </div>
          <div class="kpi-card">
            <i class="fas fa-file-alt"></i>
            <h3>Today's Orders</h3>
            <h2>18</h2>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
